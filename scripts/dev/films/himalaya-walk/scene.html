// Himalaya Walk: an original illustrated walk for the film behind the invitation, in bright morning
// light. A stone path beside a glacial river leads up a stair between terraced fields to an invented
// mountain shrine of grey granite and timber; through its gate into a courtyard of brass bells and
// marigolds; into a pillared hall where the bells sway in shafts of sun; and it comes to rest before
// the closed carved doors of the sanctum, glowing softly from within. Invented architecture, no real
// temple; no figures, symbols or sacred text anywhere.
// render(t) is deterministic, so every render and every frame sheet matches.
window.SECONDS = 20;

// A ragged line between two points (midpoint displacement), for ridges and rock.
function jag(x0, y0, x1, y1, rough, depth, r) {

}

  const lo = [], up = [];

function ashlar(g, x0, y0, x1, y1, course, seed, tone = 0) {

}

// A brass bell hanging from (x, y) on screen by a chain of length `chain` (in its own units).

}

// ---------- the mountains: painted cards far away ----------

  const R = jag(pk.x, -pk.h, pk.x + pk.wr, 0, 0.3, 7, r);
  const out = L.concat(R.slice(1));
  g.save(); poly(g, out);
  const rg = g.createLinearGradient(0, -pk.h, 0, 0); rg.addColorStop(0, st.rock[0]); rg.addColorStop(1, st.rock[1]);
  g.fillStyle = rg; g.fill(); g.clip();

  const sl = -pk.h * st.snow, snow = [[pk.x - pk.wl - 20, -pk.h - 200], [pk.x + pk.wr + 20, -pk.h - 200]];
  const n = 70;

    const x = pk.x - pk.wl + ((pk.wl + pk.wr) * i) / n;
    let y = sl + (r() - 0.5) * pk.h * 0.06;
    if (r() < 0.28) y += pk.h * (0.06 + r() * 0.2);

  g.fillStyle = st.crack;

    const u = r(), x0 = pk.x + (u - 0.5) * (pk.wl + pk.wr) * 0.55, y0 = -pk.h * (0.5 + r() * 0.36), len = pk.h * (0.08 + r() * 0.16), wd = pk.h * (0.015 + r() * 0.03);

    poly(g, side.concat(back)); g.fill();

  const ridge = jag(pk.x, -pk.h, pk.x + pk.wr * (0.08 + r() * 0.22), 0, 0.42, 6, r);
  poly(g, ridge.concat([[pk.x + pk.wr + 40, 0], [pk.x + pk.wr + 40, -pk.h - 60]])); g.fillStyle = st.shadow; g.fill();

}

  } });
  for (const sgn of [-1, 1]) items.push({ z: 3250, draw: () => {
    put(lampPillar, sgn * 470, TOP, 3250);
    for (const l of pillarLamps) { const p = P(sgn * 470 + l.x, TOP + l.y, 3249); if (p.d > 25) flame(ctx, p.x, p.y, 1.1 * p.s, t, l.x + l.k + sgn, 1); }
  } });
  // The hall's front, the tower above it, the trees on the plateau.
  if (!inside) items.push({ z: TOWER_Z, draw: () => put(tower, 0, TOP, TOWER_Z) });
  if (cam.z < HALL_Z - 25) items.push({ z: HALL_Z, draw: () => {
    put(porch, 0, TOP, HALL_Z);
    for (const b of porchBells) { const p = P(b.x, TOP - 560, HALL_Z - 2); bell(ctx, p.x, p.y, p.s, Math.sin(t * 1.7 + b.x) * 0.12, b.chain, 1, 0.1); }
    for (const d of plinthDiyas) { const p = P(d.x, TOP - 44, HALL_Z - 6); if (p.d > 25) diya(ctx, p.x, p.y, 1.3 * p.s, t, d.ph, 1); }
  } });
  // The hall: stone-and-timber walls, a wooden ceiling, sunlight through the windows on the left.
  items.push({ z: DOOR_Z + 1, draw: () => {
    const fg = ctx.createLinearGradient(0, P(0, TOP, DOOR_Z).y, 0, H); fg.addColorStop(0, '#b0a08a'); fg.addColorStop(1, '#6a5e50');
    deck(-HALL_X, HALL_X, TOP, HALL_Z, DOOR_Z, fg);
    if (cam.y < TOP) {
      deck(-110, 110, TOP, HALL_Z, DOOR_Z - 20, '#9a8c78'); deck(-100, 100, TOP, HALL_Z, DOOR_Z - 20, '#a89a84');
      ctx.strokeStyle = 'rgba(30,26,22,0.3)'; ctx.lineWidth = 1.5;
      for (let z = HALL_Z + 110; z < DOOR_Z; z += 110) { if (z < cam.z + 30) continue; const a = P(-HALL_X, TOP, z), b = P(HALL_X, TOP, z); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      strewn(hallFloorPetals.map((p) => ({ ...p, y: TOP })));
    }
    deck(-HALL_X, HALL_X, CEIL, HALL_Z, DOOR_Z, '#3e2c1e', true);
    for (const z of BAYS) {
      if (z - 100 < cam.z + 30) continue;
      deck(-HALL_X + 40, HALL_X - 40, CEIL, z - 100, z + 100, '#523a26', true);
      deck(-HALL_X + 70, HALL_X - 70, CEIL, z - 80, z + 80, '#3a2818', true);
      const c = P(0, CEIL, z), n = P(0, CEIL, z - 60), f = P(0, CEIL, z + 60);
      ctx.save(); ctx.translate(c.x, (n.y + f.y) / 2); ctx.scale(1, Math.max(0.05, Math.abs(n.y - f.y) / (120 * c.s))); rosette(ctx, 0, 0, 38 * c.s, 'rgba(190,140,80,0.42)'); ctx.restore();
    }
    for (const z of PILLARS) {
      if (z - 16 < cam.z + 30) continue;
      deck(-HALL_X, HALL_X, CEIL, z - 16, z + 16, '#6a4a2c', true);
      const a = P(-HALL_X, CEIL, z - 16), b = P(HALL_X, CEIL, z - 16), c = P(HALL_X, CEIL + 26, z - 16), d = P(-HALL_X, CEIL + 26, z - 16);
      poly(ctx, [[a.x, a.y], [b.x, b.y], [c.x, c.y], [d.x, d.y]]); ctx.fillStyle = '#5a3c22'; ctx.fill();
    }
    for (const sgn of [-1, 1]) {
      const x = sgn * HALL_X;
      wallPlane(x, CEIL, TOP, HALL_Z, DOOR_Z, sgn < 0 ? '#9a9084' : '#7e766a');
      for (const y of [TOP - 130, TOP - 290, TOP - 450]) wallPlane(x, y - 26, y, HALL_Z, DOOR_Z, sgn < 0 ? '#7a5030' : '#5e3c24');
      ctx.strokeStyle = 'rgba(40,36,34,0.3)'; ctx.lineWidth = 1.2;
      for (const y of [TOP - 50, TOP - 90, TOP - 200, TOP - 245, TOP - 360, TOP - 405, TOP - 510]) { const z0 = Math.max(HALL_Z, cam.z + 30); const a = P(x, y, z0), b = P(x, y, DOOR_Z); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      for (const zc of windowsL) {
        const s = onWall(x, zc, TOP - 340, [[-50, 0], [-50, -120], [50, -120], [50, 0]]); if (!s) continue;
        poly(ctx, s); ctx.fillStyle = sgn < 0 ? '#f4f8fc' : '#bcd4ea'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#4a2e18'; ctx.stroke();
        const m = onWall(x, zc, TOP - 340, [[0, 0], [0, -120]]); if (m) { polyline(ctx, m); ctx.stroke(); }
      }
    }
    // Shafts of morning sun from the left windows, down across the floor.
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const zc of windowsL) {
      const corners = [];
      for (const [y, dz] of [[TOP - 460, -50], [TOP - 460, 50], [TOP - 340, 50], [TOP - 340, -50]]) {
        const k = (TOP - y) / SUN[1];
        corners.push([-HALL_X, y, zc + dz], [-HALL_X + k * SUN[0], TOP, zc + dz + k * SUN[2]]);
      }
      const near = Math.min(...corners.map((c) => c[2])) - cam.z; if (near < 60) continue;
      const fade = smooth((near - 60) / 300);
      const pts = hull(corners.map(([x, y, z]) => { const p = P(x, y, z); return [p.x, p.y]; }));
      poly(ctx, pts); ctx.fillStyle = `rgba(255,236,196,${(0.14 * fade).toFixed(3)})`; ctx.fill();
      const fl = [0, 2, 4, 6].map((i) => corners[i + 1]).map(([x, y, z]) => { const p = P(x, y, z); return [p.x, p.y]; });
      poly(ctx, hull(fl)); ctx.fillStyle = `rgba(255,228,178,${(0.32 * fade).toFixed(3)})`; ctx.fill();
    }
    for (const m of motes) {
      const zc = windowsL[m.w], y = mix(TOP - 460, TOP - 340, m.v), k = ((TOP - y) / SUN[1]) * m.k;
      const p = P(-HALL_X + k * SUN[0] + Math.sin(t * 0.5 + m.ph) * 10, y + k * SUN[1] + Math.sin(t * 0.3 + m.ph * 2) * 8, zc + (m.u - 0.5) * 100 + k * SUN[2]);
      if (p.d < 80) continue;
      const a = 0.5 * (0.5 + 0.5 * Math.sin(t * 1.5 + m.ph)) * smooth((p.d - 80) / 300);
      ctx.fillStyle = `rgba(255,246,220,${a.toFixed(3)})`; const sz = Math.min(4, 2 * p.s); ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
    ctx.restore();
  } });
  items.push({ z: DOOR_Z, draw: () => {
    put(doorCard, 0, TOP, DOOR_Z);
    // Light from within, through the seam and under the doors.
    const pulse = 0.85 + 0.15 * Math.sin(t * 1.3);
    const top = P(0, TOP - DOOR.h + 6, DOOR_Z - 1), bot = P(0, TOP - 4, DOOR_Z - 1);
    if (top.d > 30) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const sg = ctx.createLinearGradient(0, top.y, 0, bot.y); sg.addColorStop(0, 'rgba(255,200,120,0.3)'); sg.addColorStop(1, 'rgba(255,220,150,0.9)');
      ctx.fillStyle = sg; ctx.fillRect(top.x - Math.max(1, 1.6 * top.s), top.y, Math.max(2, 3.2 * top.s), bot.y - top.y);
      glow(ctx, bot.x, (top.y + bot.y) / 2, Math.min(300 * top.s, 420), 'rgba(255,180,100,A)', 0.24 * pulse);
      glow(ctx, bot.x, (top.y + bot.y) / 2, Math.min(120 * top.s, 200), 'rgba(255,214,150,A)', 0.22 * pulse);
      const th = P(-DOOR.w / 2, TOP - 2, DOOR_Z - 1), th2 = P(DOOR.w / 2, TOP, DOOR_Z - 1);
      ctx.fillStyle = `rgba(255,214,140,${(0.8 * pulse).toFixed(3)})`; ctx.fillRect(th.x, th.y - 2 * th.s, th2.x - th.x, 3 * th.s);
      ctx.restore();
    }
    floorGlow(0, TOP, DOOR_Z - 140, 180, 0.3 * pulse);
    for (const b of doorBells) { const p = P(b.x, TOP - 520, DOOR_Z - 4); bell(ctx, p.x, p.y, p.s, Math.sin(t * 1.4 + b.x) * 0.08, b.chain, 1.1, 0.12); }
  } });
  for (const sgn of [-1, 1]) items.push({ z: DOOR_Z - 80, draw: () => {
    put(standLamp, sgn * 236, TOP, DOOR_Z - 80);
    for (const w of lampWicks) { const p = P(sgn * 236 + w.x, TOP + w.y, DOOR_Z - 81); if (p.d > 25) flame(ctx, p.x, p.y, 0.8 * p.s, t, w.x + w.y + sgn, 1); }
    light(P(sgn * 236, TOP - 200, DOOR_Z - 82), 160, 'rgba(255,190,110,A)', 0.22);
  } });
  for (const z of PILLARS) for (const sgn of [-1, 1]) items.push({ z, draw: () => put(pillarCard, sgn * PILLAR_X, TOP, z) });
  for (const b of hallBells) items.push({ z: b.z, draw: () => {
    const p = P(b.x, CEIL, b.z); if (p.d < 40) return;
    const near = smooth((1400 - p.d) / 800);
    bell(ctx, p.x, p.y, p.s, Math.sin(t * 1.9 + b.ph) * (0.1 + 0.12 * near), b.chain, 0.95, 0.14);
  } });
  items.sort((a, b) => b.z - a.z).forEach((it) => it.draw());
}

window.render = function (t) {
  cam.z = walkAt(t); cam.y = eyeAt(cam.z); cam.x = 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawSky(t);
  drawWorld(t);
  // Marigold petals drift down before the doors.
  for (const p of hallPetals) {
    const age = t - p.ts; if (age < 0) continue;
    const y = p.y0 + age * p.v; if (y > H + 30) continue;
    const x = p.x + Math.sin(age * 1.4 + p.ph) * p.sway;
    ctx.save(); ctx.translate(x, y); ctx.rotate(age * 2 + p.ph); ctx.fillStyle = p.c; ctx.globalAlpha = 0.9 * clamp(age / 0.4);
    ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  // Indoors the stone takes on the warmth of lamps and sun.
  const warm = smooth((cam.z - HALL_Z + 300) / 500);
  if (warm > 0) { ctx.save(); ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = `rgba(255,180,100,${(0.45 * warm).toFixed(3)})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  // Indoors the light falls away from the windows; the floor nearest the guest dims.
  const fl = ctx.createLinearGradient(0, H * 0.74, 0, H);
  fl.addColorStop(0, 'rgba(14,18,22,0)'); fl.addColorStop(1, `rgba(14,18,22,${cam.z > HALL_Z ? 0.5 : 0.32})`);
  ctx.fillStyle = fl; ctx.fillRect(0, H * 0.74, W, H * 0.26);
  const v = ctx.createRadialGradient(540, 900, 460, 540, 900, 1320);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(10,16,30,0.3)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.05; ctx.drawImage(grain, 0, 0, W, H); ctx.restore();
};
render(0);
</script>
</body>
</html>
