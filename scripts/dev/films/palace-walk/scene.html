// courtyard of fountains; through a hall of mirror mosaic that glints as they move; out onto a marble
// terrace under the stars, where fireworks rise over the city. Invented architecture, no real palace.

window.SECONDS = 20;

// ---------- the sky: dusk, then night (each painted once) ----------
function paintSky(night) {

  const g = cv.getContext('2d');

  else { bg.addColorStop(0, '#1a1d4e'); bg.addColorStop(0.4, '#4a3070'); bg.addColorStop(0.7, '#b0587a'); bg.addColorStop(0.9, '#f09a78'); bg.addColorStop(1, '#ffc890'); }
  g.fillStyle = bg; g.fillRect(0, 0, W, HZ);
  const low = g.createLinearGradient(0, HZ, 0, H);
  low.addColorStop(0, night ? '#1c1424' : '#4a2a3a'); low.addColorStop(1, '#0a0810');
  g.fillStyle = low; g.fillRect(0, HZ, W, H - HZ);
  const r = rng(night ? 17 : 19);

  for (let i = 0; i < 14; i++) {

    const cg = g.createRadialGradient(x, y, 0, x, y, w);

    cg.addColorStop(0, `rgba(${col},${night ? 0.08 : 0.22})`); cg.addColorStop(1, `rgba(${col},0)`);
    g.save(); g.translate(x, y); g.scale(1, 0.14); g.translate(-x, -y); g.fillStyle = cg; g.fillRect(x - w, y - w, w * 2, w * 2); g.restore();
  }
  if (!night) glow(g, 300, HZ - 40, 520, 'rgba(255,190,120,A)', 0.45);
  // Far hills with a fort and the lights of the city, seen beyond the terrace.
  g.fillStyle = night ? '#120e22' : '#3a2440';
  g.beginPath(); g.moveTo(0, HZ);
  for (let x = 0; x <= W; x += 20) g.lineTo(x, HZ - 30 - Math.sin(x * 0.006) * 26 - Math.sin(x * 0.021 + 1) * 10);

}

      for (let z = GATE_Z + 30; z < COURT_END; z += 40) { const p = P(x, -742, z); if (p.d > 40) lampGlow(p, 10, 'rgba(255,200,120,A)', 0.7); }
    }
  } });
  for (const [fx, z] of FOUNTAINS) items.push({ z, draw: () => {
    put(fountain, fx, 0, z);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 60; k++) {
      const a = (k / 60) * Math.PI * 2, age = (t * 0.9 + (k % 12) / 12) % 1;
      const rr = 70 * age, h = -80 - 320 * age + 380 * age * age;
      const p = P(fx + Math.cos(a) * rr, h, z + Math.sin(a) * rr * 0.6); if (p.d < 30) continue;
      ctx.fillStyle = `rgba(210,240,255,${(0.7 * (1 - age)).toFixed(3)})`; ctx.fillRect(p.x - 2 * p.s, p.y - 2 * p.s, 4 * p.s, 4 * p.s);
    }
    ctx.restore();
  } });
  for (const l of lotus) items.push({ z: l.z, draw: () => {
    const p = P(l.x + Math.sin(t * 0.5 + l.ph) * 6, 0, l.z); if (p.d < 30 || p.y > H) return;
    ctx.fillStyle = '#f0a0b8'; ctx.beginPath(); ctx.ellipse(p.x, p.y, 12 * p.s, 4 * p.s, 0, 0, Math.PI * 2); ctx.fill();
    flame(ctx, p.x, p.y - 2 * p.s, 0.9 * p.s, t, l.ph, smooth((t - 4.8) / 0.6));
  } });
  if (outside || cam.z < GATE_Z + 500) items.push({ z: GATE_Z + 0.5, draw: () => drawDoors(t) });
  if (outside) {
    items.push({ z: GATE_Z, draw: () => {
      put(facade, 0, 0, GATE_Z);
      for (const [x, y] of gateLamps) {
        const a = smooth((t - 1.6 - Math.abs(x) / 1400 * 1.2) / 0.4); if (a <= 0) continue;
        const p = P(x, y, GATE_Z - 1); lampGlow(p, 14, 'rgba(255,200,120,A)', 0.6 * a);
        ctx.fillStyle = `rgba(255,240,200,${a.toFixed(3)})`; ctx.fillRect(p.x - 1.4 * p.s, p.y - 1.4 * p.s, 2.8 * p.s, 2.8 * p.s);
      }
      // Gold light pours out as the doors open.
      const open = Math.sin(openAt(t) / 1.38 * Math.PI / 2);
      const g = P(0, -300, GATE_Z - 2); lampGlow(g, 600, 'rgba(255,190,110,A)', 0.08 + 0.3 * open);
      floorGlow(0, 0, GATE_Z - 260, 240, 0.4 * open);
    } });
  }
  for (const tr of trees) items.push({ z: tr.z, draw: () => put(cypress, tr.x, 0, tr.z) });
  for (const l of posts) items.push({ z: l.z - 1, draw: () => {
    const lit = smooth((t - l.at) / 0.4);
    put(lampPost, l.x, 0, l.z); if (lit < 1) put(lampDark, l.x, 0, l.z, 1 - lit);
    const p = P(l.x, -473, l.z - 1); if (p.d > 30 && lit > 0) { lampGlow(p, 160, 'rgba(255,190,110,A)', 0.5 * lit); floorGlow(l.x, 0, l.z, 150, 0.25 * lit); }
  } });
  items.sort((a, b) => b.z - a.z).forEach((it) => it.draw());
}

window.render = function (t) {
  cam.z = walkAt(t); cam.y = -150; cam.x = 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawSky(t);
  drawFinale(t);
  drawWorld(t);
  // Rose and jasmine petals drift over the terrace.
  for (const p of petals) {
    const age = t - p.ts; if (age < 0) continue;
    const y = p.y0 + age * p.v; if (y > H + 30) continue;
    const x = p.x + Math.sin(age * 1.4 + p.ph) * p.sway;
    ctx.save(); ctx.translate(x, y); ctx.rotate(age * 2 + p.ph); ctx.fillStyle = p.c; ctx.globalAlpha = 0.9 * clamp(age / 0.4);
    ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  // Past the gate, the floor nearest the guest falls into shadow, so the eye goes on ahead.
  if (cam.z > GATE_Z) {
    const fl = ctx.createLinearGradient(0, H * 0.7, 0, H);
    fl.addColorStop(0, 'rgba(10,4,10,0)'); fl.addColorStop(1, 'rgba(10,4,10,0.55)');
    ctx.fillStyle = fl; ctx.fillRect(0, H * 0.7, W, H * 0.3);
  }
  const v = ctx.createRadialGradient(540, 900, 420, 540, 900, 1300);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.07; ctx.drawImage(grain, 0, 0, W, H); ctx.restore();
};
render(0);
</script>
</body>
