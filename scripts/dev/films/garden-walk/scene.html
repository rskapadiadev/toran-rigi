// Garden Walk: an original illustrated walk for the film behind the invitation, for any tradition
// (no sacred symbols). At golden hour the guest walks a lavender-lined path to a rose archway in a
// clipped hedge; fairy lights switch on through an avenue of trees; a rose arbour, its lanterns lit
// as they pass; a reflecting pool of floating candles; and a ceremony aisle of white chairs ending
// at a flower moon-gate by a lake, as blue hour falls and fireflies rise.
// render(t) is deterministic, so every render and every frame sheet matches.
window.SECONDS = 20;

// ---------- the world ----------
const HEDGE_Z = 1600;
const TREES = []; for (let z = 1800; z <= 2900; z += 220) TREES.push(z);
// A narrow tunnel, so its rose walls stay in view from inside.
const ARBOUR = []; for (let z = 3100; z <= 3900; z += 160) ARBOUR.push(z);
const ARBOUR_X = 215;
const POOL_Z0 = 4400, POOL_Z1 = 5250, POOL_X = 150;
const ROWS = []; for (let z = 5650; z <= 6250; z += 120) ROWS.push(z);
const ARCH_Z = 6450, LAKE_Z = 6650;
const GATE = { w: 520, h: 860 };
const BOWER = { w: 400, h: 760 };

// The holds the invitation rests on: 3.6 the rose archway at golden hour, 6.0 the fairy lights coming
// on beyond it, 9.6 the avenue before the arbour, 12.4 inside the arbour, 15.2 the reflecting pool,

const keys = [[0, -700], [3.6, -640], [6.0, 900], [8.4, 2000], [9.6, 2650], [12.4, 3330], [15.2, 4250], [17.6, 5280], [20, 5500]];

// ---------- the sky: golden hour, dusk, blue hour ----------
function paintSky(kind) {
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  const stops = {
    // Deep at the top even at golden hour, so the gold names read over it.
    gold: ['#1e2a5e', '#4a5a92', '#c89aa0', '#ffcc96', '#ffe6b4'],
    dusk: ['#18225a', '#4a4a88', '#c87a92', '#f6a886', '#ffd0a0'],
    blue: ['#0a1238', '#1c2a62', '#3e4a86', '#7a6a9a', '#c08898'],
  }[kind];
  const bg = g.createLinearGradient(0, 0, 0, HZ);
  stops.forEach((col, i) => bg.addColorStop(i / (stops.length - 1), col));
  g.fillStyle = bg; g.fillRect(0, 0, W, HZ);
  g.fillStyle = stops[4]; g.fillRect(0, HZ, W, H - HZ);
  const r = rng({ gold: 3, dusk: 5, blue: 7 }[kind]);
  for (let i = 0; i < 16; i++) {
    const x = r() * W, y = 200 + r() * 700, w = 180 + r() * 340;
    const col = kind === 'blue' ? '120,110,170' : '255,226,210';
    const cg = g.createRadialGradient(x, y, 0, x, y, w);
    cg.addColorStop(0, `rgba(${col},${kind === 'blue' ? 0.1 : 0.3})`); cg.addColorStop(1, `rgba(${col},0)`);
    g.save(); g.translate(x, y); g.scale(1, 0.18); g.translate(-x, -y); g.fillStyle = cg; g.fillRect(x - w, y - w, w * 2, w * 2); g.restore();
  }
  if (kind !== 'blue') {
    // The low sun behind the garden.
    glow(g, 330, HZ - 140, 520, kind === 'gold' ? 'rgba(255,230,170,A)' : 'rgba(255,170,130,A)', 0.55);
    g.fillStyle = kind === 'gold' ? '#fff4d8' : '#ffd0a8'; g.beginPath(); g.arc(330, HZ - 140, 46, 0, Math.PI * 2); g.fill();
  }
  // The far shore of the lake, a soft line of trees.
  g.fillStyle = { gold: '#5a6a5a', dusk: '#4a4a62', blue: '#1a2036' }[kind];
  g.beginPath(); g.moveTo(0, HZ);
  for (let x = 0; x <= W; x += 14) g.lineTo(x, HZ - 18 - Math.abs(Math.sin(x * 0.05)) * 14 - Math.sin(x * 0.013) * 10);
  g.lineTo(W, HZ); g.closePath(); g.fill();
  if (kind === 'blue') { g.globalCompositeOperation = 'lighter'; for (let i = 0; i < 60; i++) { g.fillStyle = 'rgba(255,214,150,0.7)'; g.fillRect(r() * W, HZ - 6 - r() * 14, 2, 2); } }
  return cv;
}
const skies = { gold: paintSky('gold'), dusk: paintSky('dusk'), blue: paintSky('blue') };

{ const r = rng(29); for (let i = 0; i < 180; i++) stars.push({ x: r() * W, y: r() * (HZ - 300), s: r() * 1.4 + 0.3, ph: r() * 6 }); }
const crescent = document.createElement('canvas'); crescent.width = crescent.height = 240;
{ const g = crescent.getContext('2d'); glow(g, 120, 120, 110, 'rgba(255,240,210,A)', 0.25);
  const m = document.createElement('canvas'); m.width = m.height = 80; const mg = m.getContext('2d');
  mg.fillStyle = '#fff4dc'; mg.beginPath(); mg.arc(40, 40, 30, 0, Math.PI * 2); mg.fill();
  mg.globalCompositeOperation = 'destination-out'; mg.beginPath(); mg.arc(55, 30, 27, 0, Math.PI * 2); mg.fill();
  g.drawImage(m, 80, 80); }
const birds = [];
{ const r = rng(31); for (let i = 0; i < 9; i++) birds.push({ x0: -80 - r() * 300, y: 260 + r() * 360, v: 60 + r() * 50, s: 0.6 + r() * 0.6, ph: r() * 6 }); }

// ---------- flowers and leaves ----------
const roseCols = ['#f2b8c0', '#e88a9a', '#fff0f0', '#d8586e', '#f7d2c4'];
function roses(g, x0, y0, x1, y1, n, seed, size = 9) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const x = mix(x0, x1, r()), y = mix(y0, y1, r());
    g.fillStyle = r() < 0.45 ? '#3a6a3a' : '#4a7a40';
    g.beginPath(); g.ellipse(x + 6, y + 4, size * 0.9, size * 0.5, r() * 3, 0, Math.PI * 2); g.fill();
    if (r() < 0.6) {
      const c = roseCols[Math.floor(r() * roseCols.length)], s = size * (0.7 + r() * 0.6);
      g.fillStyle = c; g.beginPath(); g.arc(x, y, s, 0, Math.PI * 2); g.fill();
      g.strokeStyle = 'rgba(120,40,60,0.35)'; g.lineWidth = 1.2; g.beginPath(); g.arc(x, y, s * 0.5, 0.5, 4.5); g.stroke();
    }
  }
}
function wisteria(g, x, y, len, seed) {
  const r = rng(seed);
  for (let k = 0; k < len; k += 7) { const w = (1 - k / len) * 9 + 2; g.fillStyle = r() < 0.5 ? '#b8a0e0' : '#9a80d0'; g.beginPath(); g.ellipse(x + (r() - 0.5) * 6, y + k, w, 4.5, 0, 0, Math.PI * 2); g.fill(); }
}

// ---------- the path to the hedge ----------

  pts.push([r, -(GATE.h - r)], [r, 0]);
  return pts;
})();
const hedge = card(3200, 1100, 1.15, (g) => {
  const hg = g.createLinearGradient(0, -720, 0, 0); hg.addColorStop(0, '#3e6a3a'); hg.addColorStop(1, '#1e3a22');
  g.fillStyle = hg; g.fillRect(-1600, -720, 3200, 720);
  const r = rng(41);
  for (let i = 0; i < 2400; i++) { const x = (r() - 0.5) * 3200, y = -720 + r() * 720; g.fillStyle = r() < 0.5 ? 'rgba(90,140,80,0.35)' : 'rgba(20,40,24,0.35)'; g.beginPath(); g.arc(x, y, 6 + r() * 8, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = 'rgba(255,220,160,0.18)'; g.fillRect(-1600, -720, 3200, 18);
  // Stone piers with urns.
  for (const sgn of [-1, 1]) {
    const x = sgn * 360;
    g.fillStyle = '#d8ccb4'; g.fillRect(x - 60, -820, 120, 820); g.fillStyle = '#efe6d4'; g.fillRect(x - 72, -840, 144, 24); g.fillRect(x - 72, -30, 144, 30);
    g.fillStyle = '#c8bca4'; g.beginPath(); g.moveTo(x - 50, -840); g.quadraticCurveTo(x - 70, -930, x - 30, -960); g.lineTo(x + 30, -960); g.quadraticCurveTo(x + 70, -930, x + 50, -840); g.fill();
    roses(g, x - 80, -1060, x + 80, -950, 40, 43 + sgn, 10);
  }
  // The iron archway, wrapped in climbing roses.
  g.save(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; poly(g, gateArch); g.fill(); g.restore();
  polyline(g, gateArch); g.lineWidth = 10; g.strokeStyle = '#2a2a2a'; g.stroke();
  polyline(g, gateArch.map(([x, y]) => [x * 1.08, y * 1.04])); g.lineWidth = 6; g.stroke();
  for (let i = 0; i < gateArch.length; i += 2) { const [x, y] = gateArch[i]; roses(g, x * 1.04 - 30, y * 1.02 - 26, x * 1.04 + 30, y * 1.02 + 26, 5, 50 + i, 10); }
  for (let i = 6; i < gateArch.length - 6; i += 6) { const [x, y] = gateArch[i]; if (y < -GATE.h + 140) wisteria(g, x, y + 10, 70 + (i % 5) * 18, 60 + i); }
});
const gateLanterns = [[-360, -1000], [360, -1000]];
const lavender = [];
{ const r = rng(51); for (let z = -900; z < HEDGE_Z - 40; z += 34) for (const sgn of [-1, 1]) lavender.push({ x: sgn * (250 + r() * 90), z, h: 36 + r() * 30, ph: r() * 6 }); }
const pathLamps = [];
for (let z = -500; z <= 1400; z += 270) for (const x of [-215, 215]) pathLamps.push({ x, z, at: 0.6 + ((z + 500) / 1900) * 2.2 });
const lantern = card(70, 110, 1.5, (g) => {
  g.fillStyle = '#2a2a2a'; g.fillRect(-26, -16, 52, 16); g.fillRect(-30, -96, 60, 10);
  g.beginPath(); g.moveTo(-30, -96); g.lineTo(0, -110); g.lineTo(30, -96); g.fill();
  g.strokeStyle = '#2a2a2a'; g.lineWidth = 4; g.strokeRect(-22, -86, 44, 70);
  g.fillStyle = 'rgba(255,240,210,0.25)'; g.fillRect(-20, -84, 40, 66);

// ---------- the avenue ----------
const tree = card(640, 1150, 1.1, (g) => {
  const tg = g.createLinearGradient(-30, 0, 30, 0); tg.addColorStop(0, '#2a1e16'); tg.addColorStop(0.5, '#5a4632'); tg.addColorStop(1, '#2a1e16');
  g.fillStyle = tg; g.beginPath(); g.moveTo(-34, 0); g.lineTo(-18, -560); g.lineTo(18, -560); g.lineTo(34, 0); g.fill();
  const r = rng(61);
  for (let i = 0; i < 520; i++) {
    const a = r() * Math.PI * 2, d = Math.sqrt(r()), x = Math.cos(a) * d * 300, y = -800 + Math.sin(a) * d * 300;
    const light = (-y - 500) / 600;
    g.fillStyle = `rgb(${Math.round(mix(30, 80, 1 - light))},${Math.round(mix(64, 120, 1 - light))},${Math.round(mix(36, 60, 1 - light))})`;
    g.beginPath(); g.arc(x, y, 26 + r() * 30, 0, Math.PI * 2); g.fill();
  }
  g.fillStyle = 'rgba(255,214,150,0.18)'; for (let i = 0; i < 60; i++) { const a = r() * Math.PI * 2, d = Math.sqrt(r()) * 280; g.beginPath(); g.arc(Math.cos(a) * d, -800 + Math.sin(a) * d - 60, 18, 0, Math.PI * 2); g.fill(); }
});

// ---------- the rose arbour ----------
const bowerArch = (() => {
  const r = BOWER.w / 2, pts = [[-r, 0], [-r, -(BOWER.h - r)]];
  for (let i = 0; i <= 60; i++) { const a = Math.PI + (i / 60) * Math.PI; pts.push([Math.cos(a) * r, -(BOWER.h - r) + Math.sin(a) * r]); }
  pts.push([r, -(BOWER.h - r)], [r, 0]);
  return pts;
})();
function paintBower(g, v) {
  // White painted posts and a round top, heavy with roses; open to the garden either side.
  g.lineWidth = 26; g.strokeStyle = '#f0ece4'; g.lineCap = 'round';
  g.beginPath(); bowerArch.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke();
  g.lineWidth = 8; g.strokeStyle = '#c8c0b4';
  g.beginPath(); bowerArch.forEach(([x, y], i) => (i ? g.lineTo(x * 1.1, y * 1.05) : g.moveTo(x * 1.1, y * 1.05))); g.stroke();
  for (let i = 0; i < bowerArch.length; i += 1) { const [x, y] = bowerArch[i]; roses(g, x * 1.05 - 36, y * 1.03 - 30, x * 1.05 + 36, y * 1.03 + 30, 6, 70 + i + v * 200, 11); }
  for (let i = 4; i < bowerArch.length - 4; i += 3) { const [x, y] = bowerArch[i]; if (y < -BOWER.h + 260) wisteria(g, x * 1.02, y + 16, 80 + ((i * 7 + v * 3) % 5) * 22, 80 + i + v * 100); }
  // A candle lantern from the crown.
  g.strokeStyle = '#3a3a3a'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, -BOWER.h); g.lineTo(0, -BOWER.h + 120); g.stroke();
  g.fillStyle = '#3a3a3a'; g.fillRect(-20, -BOWER.h + 120, 40, 8); g.fillRect(-16, -BOWER.h + 186, 32, 8);
  g.fillStyle = 'rgba(255,240,210,0.35)'; g.fillRect(-16, -BOWER.h + 128, 32, 58);
}
const bowerA = card(560, 860, 1.4, (g) => paintBower(g, 0));
const bowerB = card(560, 860, 1.4, (g) => paintBower(g, 1));
// Rose hedges either side of the arbour, as side walls flecked with blooms.
const blooms = [];
{ const r = rng(91); for (let i = 0; i < 1300; i++) blooms.push({ x: r() < 0.5 ? -ARBOUR_X : ARBOUR_X, y: -20 - r() * 520, z: ARBOUR[0] - 100 + r() * (ARBOUR[ARBOUR.length - 1] - ARBOUR[0] + 200), c: roseCols[i % roseCols.length], s: 0.7 + r() * 0.7 }); }

// ---------- the lawn, the pool, the aisle ----------
const topiary = card(200, 520, 1.2, (g) => {
  g.fillStyle = '#c8bca4'; g.fillRect(-60, -90, 120, 90); g.fillStyle = '#efe6d4'; g.fillRect(-70, -100, 140, 14);
  const cg = g.createLinearGradient(-90, 0, 90, 0); cg.addColorStop(0, '#1e3a22'); cg.addColorStop(0.6, '#4a7a44'); cg.addColorStop(1, '#1a3020');
  g.fillStyle = cg; g.beginPath(); g.moveTo(0, -520); g.quadraticCurveTo(90, -260, 80, -100); g.lineTo(-80, -100); g.quadraticCurveTo(-90, -260, 0, -520); g.fill();
});
const topiaries = [];
for (let z = 4450; z <= 5250; z += 200) for (const x of [-430, 430]) topiaries.push({ x, z });
const candlesOnPool = [];
{ const r = rng(101); for (let z = POOL_Z0 + 40; z < POOL_Z1 - 20; z += 46) candlesOnPool.push({ x: (r() - 0.5) * 2 * (POOL_X - 30), z: z + r() * 20, ph: r() * 8 }); }
const jets = [];
for (let z = POOL_Z0 + 100; z < POOL_Z1; z += 200) for (const sgn of [-1, 1]) jets.push({ x: sgn * (POOL_X - 10), z });
const chair = card(110, 210, 1.5, (g) => {
  g.strokeStyle = '#f4f0ea'; g.lineWidth = 7; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-40, 0); g.lineTo(-40, -200); g.moveTo(40, 0); g.lineTo(40, -200); g.moveTo(-40, -200); g.lineTo(40, -200); g.stroke();
  g.lineWidth = 5; g.beginPath(); g.moveTo(-40, -190); g.lineTo(40, -110); g.moveTo(40, -190); g.lineTo(-40, -110); g.stroke();
  g.fillStyle = '#f4f0ea'; g.fillRect(-46, -104, 92, 12);
  g.fillStyle = '#e8e0d4'; g.fillRect(-44, -92, 88, 6);
  // A blush chiffon sash tied in a bow across the back.
  g.fillStyle = '#f2c4c8'; g.fillRect(-42, -166, 84, 16);
  g.beginPath(); g.moveTo(0, -158); g.quadraticCurveTo(-26, -186, -30, -150); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(0, -158); g.quadraticCurveTo(26, -186, 30, -150); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(-4, -156); g.lineTo(-14, -110); g.lineTo(-4, -114); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(4, -156); g.lineTo(14, -110); g.lineTo(4, -114); g.closePath(); g.fill();
});
const posy = card(90, 120, 1.5, (g) => { roses(g, -30, -110, 30, -60, 14, 111, 9); g.fillStyle = '#4a7a40'; g.fillRect(-4, -60, 8, 40); g.fillStyle = '#f4f0ea'; g.fillRect(-20, -40, 40, 6); });
const chairs = [];
for (const z of ROWS) for (const sgn of [-1, 1]) for (let k = 0; k < 3; k++) chairs.push({ x: sgn * (200 + k * 150), z, end: k === 0 });
const moonGate = card(900, 1150, 1.4, (g) => {
  // A ring of flowers on a slender stand, chiffon falling from its top, urns of blooms at its foot.
  g.strokeStyle = '#d8c8a8'; g.lineWidth = 10; g.beginPath(); g.arc(0, -560, 360, 0, Math.PI * 2); g.stroke();
  g.fillStyle = '#d8c8a8'; g.fillRect(-380, -40, 30, 40); g.fillRect(350, -40, 30, 40);
  const r = rng(121);

    const a = -Math.PI * 1.05 + r() * Math.PI * 1.25, rr = 360 + (r() - 0.5) * 60, x = Math.cos(a) * rr, y = -560 + Math.sin(a) * rr;

const archCandles = [];

const fireflies = [];

const petals = [];

const aislePetals = [];

const gravel = [];
{ const r = rng(161); for (let i = 0; i < 260; i++) gravel.push({ x: (r() - 0.5) * 360, z: -700 + r() * (HEDGE_Z + 1400), c: r() < 0.5 ? '#f2d0d4' : '#fff6f0', a: r() * 3 }); }

// ---------- parts of a frame ----------
function drawSky(t) {
  const dusk = smooth((t - 2.5) / 6), blue = smooth((t - 9) / 7);
  ctx.drawImage(skies.gold, 0, 0);
  if (dusk > 0) { ctx.globalAlpha = dusk; ctx.drawImage(skies.dusk, 0, 0); }
  if (blue > 0) { ctx.globalAlpha = blue; ctx.drawImage(skies.blue, 0, 0); }
  ctx.globalAlpha = 1;
  if (blue > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const s of stars) { const a = (0.3 + 0.4 * Math.sin(t * 1.7 + s.ph)) * blue; ctx.fillStyle = `rgba(255,246,226,${a.toFixed(3)})`; ctx.fillRect(s.x, s.y, s.s, s.s); }
    ctx.restore();
    ctx.globalAlpha = blue; ctx.drawImage(crescent, 790 - 120, 190 - 120); ctx.globalAlpha = 1;
  }
  // Birds crossing the golden sky.
  ctx.strokeStyle = 'rgba(40,30,40,0.7)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  for (const b of birds) {

  }
}
function light(p, r, col, a) { if (p.d < 30) return; ctx.save(); ctx.globalCompositeOperation = 'lighter'; glow(ctx, p.x, p.y, Math.min(r * p.s, 380), col, a); ctx.restore(); }

function drawWorld(t) {
  const items = [];
  const blue = smooth((t - 9) / 7);
  // Ground: lawns, the gravel path, the pool, the aisle runner and the lake.
  items.push({ z: 99999, draw: () => {
    const lake = P(0, 0, LAKE_Z);
    const lg = ctx.createLinearGradient(0, HZ, 0, Math.max(HZ + 1, lake.y));
    lg.addColorStop(0, blue > 0.5 ? '#3a4070' : '#c8a0a0'); lg.addColorStop(1, blue > 0.5 ? '#1a2048' : '#7a7890');
    floorStrip(-6000, 6000, 0, LAKE_Z, 60000, lg);
    const gg = ctx.createLinearGradient(0, lake.y, 0, H); gg.addColorStop(0, mix(0, 1, blue) > 0.5 ? '#22382a' : '#4a6a3a'); gg.addColorStop(1, '#16241a');
    floorStrip(-6000, 6000, 0, -2000, LAKE_Z, gg);
    const pg = ctx.createLinearGradient(0, P(0, 0, HEDGE_Z + 1400).y, 0, H); pg.addColorStop(0, '#c8b49a'); pg.addColorStop(1, '#7a6a58');
    floorStrip(-200, 200, 0, -2000, POOL_Z0 - 60, pg);
    for (const p of gravel) { const q = P(p.x, 0, p.z); if (q.d < 30 || q.y > H) continue; ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(q.x, q.y, 7 * q.s, 3 * q.s, p.a, 0, Math.PI * 2); ctx.fill(); }
    floorStrip(-POOL_X - 22, POOL_X + 22, 0, POOL_Z0 - 22, POOL_Z1 + 22, '#e8e0d0');
    const wg = ctx.createLinearGradient(0, P(0, 0, POOL_Z1).y, 0, Math.max(P(0, 0, POOL_Z1).y + 1, P(0, 0, Math.max(POOL_Z0, cam.z + 20)).y));
    wg.addColorStop(0, blue > 0.5 ? '#3a4a80' : '#a8b8d0'); wg.addColorStop(1, blue > 0.5 ? '#141c3a' : '#4a5a7a');
    floorStrip(-POOL_X, POOL_X, 0, POOL_Z0, POOL_Z1, wg);
    floorStrip(-200, 200, 0, POOL_Z1 + 22, ARCH_Z, '#c8b49a');
    floorStrip(-110, 110, 0, ROWS[0] - 80, ARCH_Z - 60, '#f4eee4');
    for (const p of aislePetals) { const q = P(p.x, 0, p.z); if (q.d < 30 || q.y > H) continue; ctx.fillStyle = p.c; ctx.beginPath(); ctx.ellipse(q.x, q.y, 7 * q.s, 3 * q.s, p.a, 0, Math.PI * 2); ctx.fill(); }
  } });
  // The lake's candlelit edge and the moon-gate.
  items.push({ z: ARCH_Z, draw: () => {
    put(moonGate, 0, 0, ARCH_Z);
    light(P(0, -560, ARCH_Z - 1), 420, 'rgba(255,210,170,A)', 0.12 + 0.18 * blue);
  } });
  for (const c of archCandles) items.push({ z: c.z, draw: () => {
    const p = P(c.x, 0, c.z); if (p.d < 30) return;
    ctx.fillStyle = '#f4eee0'; const h = 40 * c.h * p.s; ctx.fillRect(p.x - 7 * p.s, p.y - h, 14 * p.s, h);
    flame(ctx, p.x, p.y - h, 1.3 * p.s, t, c.x, smooth((t - 12.5) / 0.6));
    floorGlow(c.x, 0, c.z, 120, 0.25 * smooth((t - 12.5) / 0.6));
  } });
  for (const ch of chairs) items.push({ z: ch.z, draw: () => { put(chair, ch.x, 0, ch.z); if (ch.end) put(posy, ch.x - Math.sign(ch.x) * 46, -120, ch.z - 2); } });
  for (const tp of topiaries) items.push({ z: tp.z, draw: () => put(topiary, tp.x, 0, tp.z) });
  for (const c of candlesOnPool) items.push({ z: c.z, draw: () => {
    const p = P(c.x + Math.sin(t * 0.6 + c.ph) * 6, 0, c.z); if (p.d < 30 || p.y > H) return;
    ctx.fillStyle = '#fff6ea'; ctx.beginPath(); ctx.ellipse(p.x, p.y, 10 * p.s, 4 * p.s, 0, 0, Math.PI * 2); ctx.fill();
    const lit = smooth((t - 9.4) / 0.8) * smooth((2600 - p.d) / 400);
    flame(ctx, p.x, p.y - 3 * p.s, 0.9 * p.s, t, c.ph, lit);
    if (lit > 0) floorGlow(c.x, 0, c.z, 50, 0.3 * lit);
  } });
  for (const j of jets) items.push({ z: j.z, draw: () => {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (let k = 0; k < 14; k++) {
      const age = (t * 1.1 + k / 14) % 1, x = j.x - Math.sign(j.x) * 90 * age, y = -150 * age + 150 * age * age * 1.05;
      const p = P(x, y - 4, j.z); if (p.d < 30) continue;
      ctx.fillStyle = `rgba(220,240,255,${(0.75 * (1 - age * 0.6)).toFixed(3)})`; ctx.fillRect(p.x - 2 * p.s, p.y - 2 * p.s, 4 * p.s, 4 * p.s);
    }
    ctx.restore();
  } });
  // The arbour: rose hedges either side, then each arch with its lantern lit as the guest nears.
  items.push({ z: ARBOUR[ARBOUR.length - 1] + 101, draw: () => {
    const z0 = ARBOUR[0] - 100, z1 = ARBOUR[ARBOUR.length - 1] + 100;
    for (const sgn of [-1, 1]) wallPlane(sgn * ARBOUR_X, -560, 0, z0, z1, '#2a4a2c');
    for (const b of blooms) {
      const p = P(b.x, b.y, b.z); if (p.d < 40 || p.x < -20 || p.x > W + 20 || p.y > H + 20) continue;
      ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(p.x, p.y, Math.min(16, 9 * p.s * b.s), 0, Math.PI * 2); ctx.fill();
    }
  } });
  ARBOUR.forEach((z, n) => items.push({ z, draw: () => {
    put(n % 2 ? bowerB : bowerA, 0, 0, z);
    const p = P(0, -BOWER.h + 158, z - 1);
    const lit = smooth((1500 - p.d) / 300) * smooth((t - 7) / 0.6);
    if (p.d > 25 && lit > 0) { flame(ctx, p.x, p.y + 20 * p.s, 1.6 * p.s, t, z, lit); light(p, 180, 'rgba(255,210,150,A)', 0.2 * lit); floorGlow(0, 0, z - 60, 140, 0.14 * lit); }
  } }));
  // The avenue: trees, fairy lights strung between them, switched on strand by strand.
  TREES.forEach((z, n) => {
    for (const sgn of [-1, 1]) items.push({ z, draw: () => put(tree, sgn * 560, 0, z) });
    items.push({ z: z - 1, draw: () => {
      const on = smooth((t - 4.2 - n * 0.28) / 0.25); if (on <= 0) return;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let x = -520; x <= 520; x += 34) {
        const u = (x + 520) / 1040, p = P(x, -760 + Math.sin(u * Math.PI) * 170, z - 1); if (p.d < 30) continue;
        const tw = 0.8 + 0.2 * Math.sin(t * 4 + x);
        glow(ctx, p.x, p.y, Math.min(16 * p.s, 60), 'rgba(255,214,150,A)', 0.75 * on * tw);
        ctx.fillStyle = `rgba(255,246,220,${on.toFixed(3)})`; ctx.fillRect(p.x - 1.5 * p.s, p.y - 1.5 * p.s, 3 * p.s, 3 * p.s);
      }
      ctx.restore();
    } });
  });
  // Fireflies over the lawn as the light goes.
  items.push({ z: 3550, draw: () => {
    const on = smooth((t - 11) / 2); if (on <= 0) return;
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const f of fireflies) {
      const p = P(f.x + Math.sin(t * 0.7 * f.sp + f.ph) * 60, f.y + Math.sin(t * 1.1 * f.sp + f.ph * 2) * 40, f.z); if (p.d < 60 || p.x < -20 || p.x > W + 20) continue;
      const b = on * (0.35 + 0.65 * Math.max(0, Math.sin(t * 2.4 * f.sp + f.ph)) ** 3);
      glow(ctx, p.x, p.y, Math.min(14 * p.s, 40), 'rgba(220,255,150,A)', 0.7 * b);
    }
    ctx.restore();
  } });
  // The hedge with its rose archway, and the path before it.
  if (cam.z < HEDGE_Z - 25) items.push({ z: HEDGE_Z, draw: () => {
    put(hedge, 0, 0, HEDGE_Z);
    for (const [x, y] of gateLanterns) {
      const lit = smooth((t - 1.2) / 0.6);
      put(lantern, x, y + 110, HEDGE_Z - 2);
      if (lit > 0) { const p = P(x, y + 50, HEDGE_Z - 3); flame(ctx, p.x, p.y + 10 * p.s, 1.4 * p.s, t, x, lit); light(p, 160, 'rgba(255,200,130,A)', 0.3 * lit); }
    }
  } });
  for (const l of lavender) items.push({ z: l.z, draw: () => {
    const b = P(l.x, 0, l.z), top = P(l.x + Math.sin(t * 1.3 + l.ph) * 4, -l.h, l.z); if (b.d < 30 || b.y > H + 40) return;
    ctx.strokeStyle = '#4a6a3a'; ctx.lineWidth = Math.max(1, 3 * b.s); ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(top.x, top.y); ctx.stroke();
    ctx.fillStyle = '#8a70c0'; ctx.beginPath(); ctx.ellipse(top.x, top.y + 8 * b.s, 5 * b.s, 14 * b.s, 0, 0, Math.PI * 2); ctx.fill();
  } });
  for (const l of pathLamps) items.push({ z: l.z, draw: () => {
    put(lantern, l.x, 0, l.z);
    const lit = smooth((t - l.at) / 0.4); const p = P(l.x, -52, l.z - 1);
    if (lit > 0 && p.d > 30) { flame(ctx, p.x, p.y + 12 * p.s, 1.2 * p.s, t, l.z, lit); light(p, 110, 'rgba(255,200,130,A)', 0.26 * lit); floorGlow(l.x, 0, l.z, 100, 0.16 * lit); }
  } });
  items.sort((a, b) => b.z - a.z).forEach((it) => it.draw());
}

window.render = function (t) {
  cam.z = walkAt(t); cam.y = -150; cam.x = 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawSky(t);
  drawWorld(t);
  for (const p of petals) {
    const age = t - p.ts; if (age < 0) continue;
    const y = p.y0 + age * p.v; if (y > H + 30) continue;
    const x = p.x + Math.sin(age * 1.4 + p.ph) * p.sway;
    ctx.save(); ctx.translate(x, y); ctx.rotate(age * 2 + p.ph); ctx.fillStyle = p.c; ctx.globalAlpha = 0.9 * clamp(age / 0.4);
    ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  // As blue hour falls, the garden cools and dims; the lamps stay warm (drawn additively above).
  const blue = smooth((t - 9) / 7);
  if (blue > 0) {
    const cool = ctx.createLinearGradient(0, HZ - 700, 0, HZ);
    cool.addColorStop(0, 'rgba(14,20,54,0)'); cool.addColorStop(1, `rgba(14,20,54,${(0.28 * blue).toFixed(3)})`);
    ctx.fillStyle = cool; ctx.fillRect(0, HZ - 700, W, 700);
    ctx.fillStyle = `rgba(14,20,54,${(0.28 * blue).toFixed(3)})`; ctx.fillRect(0, HZ, W, H - HZ);
  }
  const fl = ctx.createLinearGradient(0, H * 0.72, 0, H);
  fl.addColorStop(0, 'rgba(8,12,10,0)'); fl.addColorStop(1, 'rgba(8,12,10,0.45)');
  ctx.fillStyle = fl; ctx.fillRect(0, H * 0.72, W, H * 0.28);
  const v = ctx.createRadialGradient(540, 900, 420, 540, 900, 1300);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.4)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.07; ctx.drawImage(grain, 0, 0, W, H); ctx.restore();
};
render(0);
</script>
</body>
</html>
