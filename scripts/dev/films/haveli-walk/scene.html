<!doctype html>
<html>

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../walk-kit.js"></script>
<script>
// Haveli Walk: an original illustrated walk for the film behind the invitation. A boat brings the
// guest to the ghats as the diyas light, fireworks rise over the haveli, the camera climbs the steps,
// passes the gate into a corridor of arches whose lamps light ahead, and comes to rest in the mandap
// court. Flat painted cards placed in depth and seen through one moving camera (2.5D).
// render(t) is deterministic, so every render and every frame sheet matches.
window.SECONDS = 20;

// ---------- the world (units: z forward, y down, ground of the river at y = 0) ----------
const STEP0 = 600, STEP_D = 110, STEPS = 10, RISE = 40, TOP = -STEPS * RISE;   // the ghats
const GATE_Z = 1800;
const ARCHES = [2100, 2350, 2600, 2850, 3100];
const RANGOLI_Z = 3850, MANDAP_Z = 4150, WALL_Z = 4650;
const GATE = { w: 420, h: 600 };
const ARCH = { w: 600, h: 820 };

// The camera's walk: seconds → depth, eased through each point (no overshoot), so its speed
// changes smoothly. The holds the invitation rests on: 3.6 names, 6.0 fireworks, 9.6 the gate,
// 12.4 the arches, 15.2 the mandap through the last arch, 19.8 the court.
const keys = [[0, -760], [3.6, -700], [6.0, -150], [8.4, 900], [9.6, 1600], [12.4, 2350], [15.2, 2950], [17.6, 3110], [20, 3170]];
const walkAt = walkPath(keys);
// Eye height: over the water from the boat, rising with the steps.
const eyeAt = (z) => -150 + TOP * smooth((z - 520) / (1760 - 520));

// ---------- the sky (infinitely far: painted once in screen space) ----------
const sky = document.createElement('canvas'); sky.width = W; sky.height = H;
const stars = [];
{
  const g = sky.getContext('2d');
  const bg = g.createLinearGradient(0, 0, 0, HZ);
  bg.addColorStop(0, '#050820'); bg.addColorStop(0.45, '#0e1642'); bg.addColorStop(0.8, '#2a2250'); bg.addColorStop(1, '#5a3448');
  g.fillStyle = bg; g.fillRect(0, 0, W, HZ);
  const low = g.createLinearGradient(0, HZ, 0, H);
  low.addColorStop(0, '#2a1a30'); low.addColorStop(1, '#0a0812');
  g.fillStyle = low; g.fillRect(0, HZ, W, H - HZ);
  // A faint band of the Milky Way, and soft cloud wisps lit from below.
  g.save(); g.translate(540, 420); g.rotate(-0.5);
  const band = g.createLinearGradient(0, -150, 0, 150);
  band.addColorStop(0, 'rgba(150,160,220,0)'); band.addColorStop(0.5, 'rgba(150,160,220,0.07)'); band.addColorStop(1, 'rgba(150,160,220,0)');
  g.fillStyle = band; g.fillRect(-1200, -150, 2400, 300); g.restore();
  const r = rng(13);
  for (let i = 0; i < 18; i++) {
    const x = r() * W, y = 250 + r() * 600, w = 160 + r() * 260;
    const cg = g.createRadialGradient(x, y, 0, x, y, w);
    cg.addColorStop(0, 'rgba(120,80,110,0.12)'); cg.addColorStop(1, 'rgba(120,80,110,0)');
    g.save(); g.translate(x, y); g.scale(1, 0.22); g.translate(-x, -y); g.fillStyle = cg; g.fillRect(x - w, y - w, w * 2, w * 2); g.restore();
  }
  for (let i = 0; i < 220; i++) stars.push({ x: r() * W, y: r() * (HZ - 250), s: r() * 1.5 + 0.3, ph: r() * 6 });
  // A thin crescent moon, cut on its own canvas so the sky behind it stays whole.
  glow(g, 860, 230, 160, 'rgba(255,236,200,A)', 0.16);
  const moon = document.createElement('canvas'); moon.width = moon.height = 80;
  const mg = moon.getContext('2d');
  mg.fillStyle = '#fff1d2'; mg.beginPath(); mg.arc(40, 40, 34, 0, Math.PI * 2); mg.fill();
  mg.globalCompositeOperation = 'destination-out'; mg.beginPath(); mg.arc(56, 30, 31, 0, Math.PI * 2); mg.fill();
  g.drawImage(moon, 820, 190);
}

// ---------- the haveli front (two paintings: before and after its lamps are lit) ----------
const gateArch = cuspedArch(GATE.w, GATE.h, 7);
const facadeLamps = [];
const facadeWindows = [];
for (const side of [-1, 1]) {
  for (let k = 0; k < 7; k++) {
    const x = side * (440 + k * 125);
    facadeWindows.push({ x, y: -440, w: 52, h: 86 }, { x, y: -250, w: 62, h: 118 });
  }
}
for (let x = -1290; x <= 1290; x += 26) if (Math.abs(x) > 345) facadeLamps.push([x, -562]);
for (let x = -330; x <= 330; x += 24) facadeLamps.push([x, -762]);
for (let i = 0; i <= 18; i++) {
  const u = i / 18;
  const bx = (t, p0, p1, p2, p3) => (1 - t) ** 3 * p0 + 3 * (1 - t) ** 2 * t * p1 + 3 * (1 - t) * t * t * p2 + t ** 3 * p3;
  // The dome's outline (see onion()): base -800, tip -940, radius 150.
  for (const sgn of [-1, 1]) facadeLamps.push([bx(u, sgn * 150, sgn * 187, sgn * 30, 0), bx(u, -800, -877, -842, -940)]);
}
function paintFacade(g, lit) {
  const wall = g.createLinearGradient(0, -560, 0, 0);
  wall.addColorStop(0, lit ? '#3e2434' : '#22162a'); wall.addColorStop(1, lit ? '#8a4c30' : '#3a2428');
  g.fillStyle = wall; g.fillRect(-1300, -560, 2600, 560);
  // Roof pavilions (chhatris) along the wings.
  for (const x of [-1150, -830, -510, 510, 830, 1150]) {
    g.fillStyle = lit ? '#5a3030' : '#2a1a26'; g.fillRect(x - 55, -650, 110, 90);
    for (const dx of [-26, 26]) { g.fillStyle = lit ? '#f5b764' : '#1a1020'; g.beginPath(); g.ellipse(x + dx, -598, 14, 26, 0, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = lit ? '#4a2830' : '#22162a'; g.fillRect(x - 66, -662, 132, 14);
    onion(g, x, -662, 46, -740); g.fill();
    g.fillStyle = '#c9973f'; g.fillRect(x - 2, -760, 4, 22);
  }
  // Cornice (chajja) with brackets.
  g.fillStyle = lit ? '#2c1a24' : '#160e18'; g.fillRect(-1300, -574, 2600, 16);
  for (let x = -1290; x < 1300; x += 40) { g.beginPath(); g.moveTo(x, -558); g.lineTo(x + 12, -558); g.lineTo(x + 6, -540); g.fill(); }
  // Windows, two rows, with jharokha hoods over the upper ones.
  for (const w of facadeWindows) {
    const arch = cuspedArch(w.w, w.h, 5).map(([x, y]) => [w.x + x, w.y + w.h / 2 + y]);
    poly(g, arch);
    if (lit) { const wg = g.createLinearGradient(0, w.y - w.h / 2, 0, w.y + w.h / 2); wg.addColorStop(0, '#ffe0a0'); wg.addColorStop(1, '#e88a3a'); g.fillStyle = wg; }
    else g.fillStyle = '#140c16';
    g.fill(); g.lineWidth = 4; g.strokeStyle = lit ? '#c58a4a' : '#3a2a2e'; g.stroke();
    g.save(); g.clip(); lattice(g, w.x - 40, w.y - 70, w.x + 40, w.y + 70, 12, lit ? 'rgba(110,50,20,0.45)' : 'rgba(0,0,0,0.3)'); g.restore();
    if (w.y < -300) {
      g.fillStyle = lit ? '#4a2830' : '#22162a';
      g.beginPath(); g.moveTo(w.x - 46, w.y - 52); g.quadraticCurveTo(w.x, w.y - 100, w.x + 46, w.y - 52); g.closePath(); g.fill();
      g.fillRect(w.x - 40, w.y + 44, 80, 10);
    }
  }
  // The gate block, its inlaid frame and spandrels.
  const gb = g.createLinearGradient(0, -760, 0, 0);
  gb.addColorStop(0, lit ? '#4c2a34' : '#24162a'); gb.addColorStop(1, lit ? '#9a5634' : '#40282a');
  g.fillStyle = gb; g.fillRect(-345, -760, 690, 760);
  g.strokeStyle = lit ? '#e9d6b0' : '#5a4a40'; g.lineWidth = 6; g.strokeRect(-300, -700, 600, 700);
  g.lineWidth = 2; g.strokeRect(-285, -686, 570, 686);
  rosette(g, -235, -640, 30, lit ? '#e9d6b0' : '#4a3a36'); rosette(g, 235, -640, 30, lit ? '#e9d6b0' : '#4a3a36');
  for (let i = 0; i < 7; i++) { const x = -270 + i * 90; g.fillStyle = lit ? '#2a1820' : '#140c14'; g.beginPath(); g.ellipse(x, -730, 14, 20, 0, 0, Math.PI * 2); g.fill(); }
  // Guldasta turrets either side of the gate.
  for (const x of [-345, 345]) { g.fillStyle = lit ? '#5a3030' : '#2a1a26'; g.fillRect(x - 16, -880, 32, 880); onion(g, x, -880, 22, -930); g.fill(); }
  // Drum and dome.
  g.fillStyle = lit ? '#4a2830' : '#22162a'; g.fillRect(-170, -800, 340, 40);
  onion(g, 0, -800, 150, -940);
  const dg = g.createLinearGradient(-150, 0, 150, 0);
  dg.addColorStop(0, lit ? '#3a2232' : '#1c1222'); dg.addColorStop(0.45, lit ? '#7a4632' : '#2e1e28'); dg.addColorStop(1, lit ? '#2c1a28' : '#160e1a');
  g.fillStyle = dg; g.fill();
  g.fillStyle = '#c9973f'; g.fillRect(-3, -995, 6, 58); g.beginPath(); g.arc(0, -968, 9, 0, Math.PI * 2); g.fill();
  // The gate opening is cut through, so the corridor beyond shows.
  g.save(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; poly(g, gateArch); g.fill(); g.restore();
  poly(g, gateArch); g.lineWidth = 8; g.strokeStyle = lit ? '#d9b36a' : '#4a3a30'; g.stroke();
  // Doors swung open against the jambs, and the toran across the top.
  for (const sgn of [-1, 1]) {
    g.fillStyle = lit ? '#5a2c1c' : '#2a160e'; g.fillRect(sgn * 210 - (sgn > 0 ? 34 : 0), -420, 34, 420);
    g.fillStyle = '#c9973f';
    for (let y = -400; y < 0; y += 34) { g.beginPath(); g.arc(sgn * 193, y, 3, 0, Math.PI * 2); g.fill(); }
  }
  if (lit) {
    leaves(g, -205, 205, -556, 14);
    garland(g, -205, -548, 0, -520, 26, 12, 21, 8); garland(g, 0, -520, 205, -548, 26, 12, 22, 8);
    strand(g, -196, -540, -360, 23); strand(g, 196, -540, -360, 24);
  }
  // The plinth.
  g.fillStyle = lit ? '#6a3a2a' : '#2a1a20'; g.fillRect(-1300, -26, 2600, 26);
}
const facadeLit = card(2600, 1000, 1.25, (g) => paintFacade(g, true));
const facadeDark = card(2600, 1000, 1.25, (g) => paintFacade(g, false));

// ---------- the corridor of arches (two paintings, alternating) ----------
const innerArch = cuspedArch(ARCH.w, ARCH.h, 9);
function paintArch(g, v) {
  const red = v ? ['#160c18', '#3a1c26'] : ['#1a0c0a', '#42201a'];
  const wall = g.createLinearGradient(0, -950, 0, 0);
  wall.addColorStop(0, red[0]); wall.addColorStop(1, red[1]);
  g.fillStyle = wall; g.fillRect(-900, -950, 1800, 950);
  // Lamplight pooled around the opening; the far corners stay in shadow.
  const pool = g.createRadialGradient(0, -520, 120, 0, -520, 820);
  pool.addColorStop(0, v ? 'rgba(210,120,90,0.5)' : 'rgba(230,140,80,0.55)'); pool.addColorStop(1, 'rgba(230,140,80,0)');
  g.fillStyle = pool; g.fillRect(-900, -950, 1800, 950);
  const inlay = v ? '#d8e2c8' : '#e9d6b0';
  // Jaali screens either side, glowing from lamps behind them.
  for (const sgn of [-1, 1]) {
    const pts = cuspedArch(260, 560, 5).map(([x, y]) => [sgn * 620 + x, -120 + y]);
    poly(g, pts); g.fillStyle = '#1a0e10'; g.fill();
    g.save(); g.clip();
    const lg = g.createRadialGradient(sgn * 620, -380, 20, sgn * 620, -380, 320);
    lg.addColorStop(0, 'rgba(255,190,110,0.9)'); lg.addColorStop(1, 'rgba(255,150,70,0.25)');
    g.strokeStyle = lg; g.lineWidth = 3;
    for (let k = -30; k < 30; k++) {
      g.beginPath(); g.moveTo(sgn * 620 - 200 + k * 22, -680); g.lineTo(sgn * 620 - 200 + k * 22 + 560, -120); g.stroke();
      g.beginPath(); g.moveTo(sgn * 620 - 200 + k * 22, -680); g.lineTo(sgn * 620 - 200 + k * 22 - 560, -120); g.stroke();
    }
    g.restore();
    poly(g, pts); g.lineWidth = 5; g.strokeStyle = inlay; g.stroke();
    g.fillStyle = v ? '#2a1a28' : '#3a1c18'; g.fillRect(sgn * 620 - 150, -120, 300, 120);
  }
  // Pilasters with capitals.
  for (const sgn of [-1, 1]) {
    g.fillStyle = v ? '#4a2434' : '#5a2a1e'; g.fillRect(sgn * 345 - 25, -840, 50, 840);
    g.fillStyle = inlay; g.fillRect(sgn * 345 - 32, -850, 64, 12); g.fillRect(sgn * 345 - 32, -14, 64, 14);
    for (let y = -800; y < -40; y += 60) { g.beginPath(); g.ellipse(sgn * 345, y, 6, 16, 0, 0, Math.PI * 2); g.fill(); }
  }
  // Alfiz frame and spandrel rosettes.
  g.strokeStyle = inlay; g.lineWidth = 6; g.strokeRect(-318, -880, 636, 880);
  g.lineWidth = 2; g.strokeRect(-304, -866, 608, 866);
  rosette(g, -240, -800, 34, inlay); rosette(g, 240, -800, 34, inlay);
  // A frieze of small arches with a gold rule.
  g.fillStyle = '#d9b36a'; g.fillRect(-900, -905, 1800, 6);
  for (let x = -880; x < 900; x += 60) { g.fillStyle = 'rgba(20,8,10,0.6)'; g.beginPath(); g.ellipse(x, -928, 12, 16, 0, 0, Math.PI * 2); g.fill(); }
  // The opening.
  g.save(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; poly(g, innerArch); g.fill(); g.restore();
  poly(g, innerArch); g.lineWidth = 10; g.strokeStyle = '#d9b36a'; g.stroke();
  const inset = cuspedArch(ARCH.w + 40, ARCH.h + 24, 9);
  poly(g, inset); g.lineWidth = 3; g.strokeStyle = inlay; g.stroke();
  // Toran and marigold strands at the arch, a brass lantern hanging from its crown.
  leaves(g, -260, 260, -728, 16);
  garland(g, -270, -712, 0, -672, 34, 14, 31 + v, 8); garland(g, 0, -672, 270, -712, 34, 14, 33 + v, 8);
  strand(g, -284, -700, -420, 35 + v); strand(g, 284, -700, -420, 37 + v);
  g.strokeStyle = '#6a4a2a'; g.lineWidth = 3; g.beginPath(); g.moveTo(0, -890); g.lineTo(0, -700); g.stroke();
  g.fillStyle = '#b8862f';
  g.beginPath(); g.moveTo(-22, -700); g.lineTo(22, -700); g.lineTo(30, -660); g.lineTo(16, -616); g.lineTo(-16, -616); g.lineTo(-30, -660); g.closePath(); g.fill();
  g.fillStyle = '#ffd890'; g.fillRect(-12, -690, 24, 62);
  g.fillStyle = '#b8862f'; g.beginPath(); g.moveTo(-10, -616); g.lineTo(10, -616); g.lineTo(0, -596); g.fill();
}
const archA = card(1800, 950, 1.25, (g) => paintArch(g, 0));
const archB = card(1800, 950, 1.25, (g) => paintArch(g, 1));

// ---------- the mandap court ----------
const mandap = card(840, 1000, 1.5, (g) => {
  // Marble plinth in three steps.
  for (let k = 0; k < 3; k++) {
    const w = 840 - k * 60, y = -k * 30;
    const pg = g.createLinearGradient(0, y - 30, 0, y);
    pg.addColorStop(0, '#e6d6b8'); pg.addColorStop(1, '#a8906c');
    g.fillStyle = pg; g.fillRect(-w / 2, y - 30, w, 30);
  }
  // The backdrop cloth with a large circle of gold.
  g.fillStyle = '#6a1a24'; g.fillRect(-230, -700, 460, 610);
  g.strokeStyle = '#d9b36a'; g.lineWidth = 5; g.beginPath(); g.arc(0, -430, 150, 0, Math.PI * 2); g.stroke();
  g.lineWidth = 2; g.beginPath(); g.arc(0, -430, 128, 0, Math.PI * 2); g.stroke();
  for (let k = 0; k < 16; k++) { const a = (k / 16) * Math.PI * 2; rosette(g, Math.cos(a) * 150, -430 + Math.sin(a) * 150, 12, '#d9b36a'); }
  // Back pillars, then front pillars, wrapped in marigold.
  for (const [x, top, w] of [[-220, -700, 26], [220, -700, 26], [-340, -730, 36], [340, -730, 36]]) {
    g.fillStyle = '#e8c48a'; g.fillRect(x - w / 2, top, w, -90 - top);
    for (let y = top + 10; y < -90; y += 24) { g.fillStyle = Math.round(y / 24) % 2 ? '#f29a2e' : '#f6c23e'; g.beginPath(); g.ellipse(x, y, w * 0.62, 9, 0, 0, Math.PI * 2); g.fill(); }
  }
  // The canopy: a red and gold tented roof with a kalash on top.
  const cg = g.createLinearGradient(-400, 0, 400, 0);
  cg.addColorStop(0, '#6a1420'); cg.addColorStop(0.5, '#b0283a'); cg.addColorStop(1, '#6a1420');
  g.fillStyle = cg;
  g.beginPath(); g.moveTo(-410, -730); g.bezierCurveTo(-330, -800, -90, -840, 0, -910); g.bezierCurveTo(90, -840, 330, -800, 410, -730); g.closePath(); g.fill();
  g.strokeStyle = '#d9b36a'; g.lineWidth = 4;
  for (const k of [0.35, 0.65]) { g.beginPath(); g.moveTo(-410 * (1 - k), -730 - 170 * k * 1.05); g.lineTo(410 * (1 - k), -730 - 170 * k * 1.05); g.stroke(); }
  g.fillStyle = '#d9b36a'; g.fillRect(-412, -738, 824, 14);
  for (let x = -404; x < 410; x += 24) { g.beginPath(); g.arc(x + 12, -724, 12, 0, Math.PI); g.fill(); }
  g.fillStyle = '#e0b867';
  g.beginPath(); g.ellipse(0, -930, 22, 20, 0, 0, Math.PI * 2); g.fill(); g.fillRect(-14, -912, 28, 8);
  g.fillStyle = '#3f7f35'; for (const dx of [-14, 0, 14]) { g.beginPath(); g.ellipse(dx, -956, 6, 14, dx * 0.03, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = '#e0b867'; g.beginPath(); g.arc(0, -972, 11, 0, Math.PI * 2); g.fill();
  // A fringe of marigold strings from the canopy's edge.
  const r = rng(41);
  for (let x = -390; x <= 390; x += 30) { if (Math.abs(x) < 150) continue; strand(g, x, -712, -712 + 90 + r() * 130, 50 + x, 5); }
  garland(g, -340, -700, 340, -700, 70, 34, 43, 7);
  // The kund and two low seats.
  g.fillStyle = '#7a1c24'; g.fillRect(-170, -122, 90, 30); g.fillRect(80, -122, 90, 30);
  g.fillStyle = '#9a6a2a'; g.fillRect(-52, -136, 104, 46);
  g.fillStyle = '#d9a84a'; g.fillRect(-60, -142, 120, 10);
  // Kalash pots with banana leaves at the front pillars.
  for (const sgn of [-1, 1]) {
    const x = sgn * 395;
    g.fillStyle = '#3f7f35';
    for (let k = 0; k < 5; k++) { g.save(); g.translate(x, -150); g.rotate(sgn * (0.15 + k * 0.12) - 0.3 * sgn); g.beginPath(); g.ellipse(0, -110, 22, 110, 0, 0, Math.PI * 2); g.fill(); g.restore(); }
    g.fillStyle = '#b5652e'; g.beginPath(); g.ellipse(x, -120, 40, 34, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#d9a84a'; g.fillRect(x - 24, -160, 48, 10);
  }
});
const backWall = card(3000, 900, 1, (g) => {
  const wg = g.createLinearGradient(0, -900, 0, 0);
  wg.addColorStop(0, '#3a2030'); wg.addColorStop(1, '#7a4630');
  g.fillStyle = wg; g.fillRect(-1500, -900, 3000, 900);
  for (const x of [-1200, -800, -400, 0, 400, 800, 1200]) {
    const pts = cuspedArch(300, 560, 7).map(([px, py]) => [x + px, py]);
    poly(g, pts);
    const ag = g.createLinearGradient(0, -560, 0, 0); ag.addColorStop(0, '#ffd690'); ag.addColorStop(1, '#c46a2c');
    g.fillStyle = ag; g.fill(); g.lineWidth = 8; g.strokeStyle = '#a8683c'; g.stroke();
    g.save(); g.clip(); lattice(g, x - 150, -560, x + 150, 0, 22, 'rgba(110,50,20,0.25)'); g.restore();
    garland(g, x - 150, -520, x + 150, -520, 40, 14, 60 + x, 6);
  }
  g.fillStyle = '#2c1a24'; g.fillRect(-1500, -650, 3000, 18);
  for (let x = -1460; x < 1500; x += 120) { g.fillStyle = '#ffcf86'; g.beginPath(); g.ellipse(x, -760, 16, 28, 0, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = '#2c1a24'; g.fillRect(-1500, -880, 3000, 14);
  for (let x = -1490; x < 1500; x += 44) g.fillRect(x, -900, 24, 22);
});
const bay = card(560, 900, 1, (g) => {
  g.fillStyle = '#4a2622'; g.fillRect(-280, -900, 560, 900);
  const pts = cuspedArch(340, 640, 7);
  poly(g, pts); const ag = g.createLinearGradient(0, -640, 0, 0); ag.addColorStop(0, '#d08a50'); ag.addColorStop(1, '#5a2a18');
  g.fillStyle = ag; g.fill(); g.lineWidth = 8; g.strokeStyle = '#d9b36a'; g.stroke();
  garland(g, -170, -600, 170, -600, 40, 14, 71, 6);
  g.fillStyle = '#2c1a24'; g.fillRect(-280, -760, 560, 16);
});

// ---------- the ghats ----------
const chhatri = card(300, 600, 1.5, (g) => {
  g.fillStyle = '#5a3a2e'; g.fillRect(-150, -60, 300, 60);
  for (const x of [-120, -40, 40, 120]) { g.fillStyle = '#7a4c34'; g.fillRect(x - 10, -360, 20, 300); }
  for (const x of [-80, 0, 80]) {
    const pts = cuspedArch(60, 230, 5).map(([px, py]) => [x + px, -60 + py]);
    poly(g, pts); g.fillStyle = 'rgba(30,14,18,0.85)'; g.fill();
  }
  g.fillStyle = '#3a2228'; g.fillRect(-170, -380, 340, 22);

    for (let k = 1; k < 5; k++) { ctx.beginPath(); ctx.moveTo(-360 + k * 30, 0); ctx.quadraticCurveTo(-90 + k * 18, -150, 0, -290 + k * 5); ctx.stroke(); }
    ctx.strokeStyle = '#c9973f'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-430, 0); ctx.quadraticCurveTo(-150, -200, 0, -330); ctx.quadraticCurveTo(150, -200, 430, 0); ctx.stroke();
    garland(ctx, -150, -210, 150, -210, 50, 18, 131, 7);
    diya(ctx, 0, -300, 2.2, t, 3, 1);
    ctx.restore();
  }
  // Marigold petals drift down over the court.
  for (const p of petals) {
    const age = t - p.ts; if (age < 0) continue;
    const y = p.y0 + age * p.v; if (y > H + 30) continue;
    const x = p.x + Math.sin(age * 1.4 + p.ph) * p.sway;
    ctx.save(); ctx.translate(x, y); ctx.rotate(age * 2 + p.ph); ctx.fillStyle = p.c; ctx.globalAlpha = 0.9 * clamp(age / 0.4);
    ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.55, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  // Inside, the floor nearest the guest falls into shadow, so the eye goes down the corridor.
  if (!outside) {
    const fl = ctx.createLinearGradient(0, H * 0.72, 0, H);
    fl.addColorStop(0, 'rgba(10,4,6,0)'); fl.addColorStop(1, 'rgba(10,4,6,0.5)');
    ctx.fillStyle = fl; ctx.fillRect(0, H * 0.72, W, H * 0.28);
  }
  // Vignette and painterly grain.
  const v = ctx.createRadialGradient(540, 900, 420, 540, 900, 1300);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.07; ctx.drawImage(grain, 0, 0, W, H); ctx.restore();
};
render(0);
